#Diagram parameters
"diagram_params": 
        "beta": 5.0
        "s_0": -1
        "vertices": []
        "h": 0.5
        "Gamma": 1.0
        "seed_number": 42

#Simulation parameters
"simulation_params": 
    "N_thermalization": 5000 #Number of thermalization steps
    "N_runs": 100000 #Number of Monte Carlo runs

# Simulation modes. The options are: "single_run", "convergence_test", and "sweep". 
"mode": "convergence_test" 
"mode_options":
    "single_run": # Performs one single run and compare the results with the analytical values. No input parameters needed

    "convergence_test": # Performs a convergence test MC estimator vs analytical magnetizations by varying the number of Monte Carlo runs
        "N_start": 500 # Initial number of Monte Carlo runs
        "N_end": 100000 # Final number of Monte Carlo runs
        "N_step": 500 # Step size for the number of Monte Carlo runs
        "accuracy": 0.01 # Percentage error for the values of the magnetizations.
        "output_file_m_z": "convergence_test_results_m_z.csv" # Output file for the convergence test results
        "output_file_m_x": "convergence_test_results_m_x.csv" # Output file for the convergence test results

    "sweep": # Performs a sweep of the magnetization as a function of a variable (h, Gamma or beta)
        "variable": "h"
        "variable_start": -2.0
        "variable_end": 2.0
        "variable_step": 0.2
        "sweep_variable": "Gamma" # Allows to plot the magnetizations vs variable for different values of one of the other two parameters
        "sweep_variable_values": [0.0, 0.5, 1.0, 2.0] # If you want one single graph just write one number here
